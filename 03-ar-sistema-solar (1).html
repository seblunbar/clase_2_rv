<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RA — Mini sistema solar (AR.js)</title>
  <!-- Versiones que DEBEN coincidir: AR.js 3.4.7 con A-Frame 1.6.0 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
  <!--
    RA basada en marcadores — versión "bonita": un mini sistema solar animado.
    PASOS:
    1) Imprime el marcador "Hiro":
       https://raw.githack.com/AR-js-org/AR.js/master/data/images/hiro.png
    2) Sube este archivo a Vercel (como index.html en un repo nuevo, o con su nombre).
    3) Abre la URL en el CELULAR, acepta la cámara y apunta al marcador impreso.

    IDEA: todo lo que va dentro de <a-marker> aparece SOBRE el marcador.
    Las órbitas se logran con "pivotes" (entidades vacías) que giran; cada planeta
    cuelga de su pivote a cierta distancia, así que orbita al sol.
  -->
  <a-scene embedded vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker preset="hiro">

      <!-- Contenedor: lo levantamos un poco y lo inclinamos para verlo mejor -->
      <a-entity position="0 0.1 0" rotation="-15 0 0">

        <!-- SOL: esfera amarilla al centro que gira sobre su eje y "late" suavemente -->
        <a-sphere radius="0.35" color="#FFC65D"
                  animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
                  animation__pulse="property: scale; dir: alternate; to: 1.08 1.08 1.08; loop: true; dur: 1500; easing: easeInOutSine">
        </a-sphere>

        <!-- Anillos-guía de las órbitas (aros delgados y translúcidos) -->
        <a-ring color="#FFFFFF" radius-inner="0.63" radius-outer="0.65" rotation="-90 0 0" opacity="0.35"></a-ring>
        <a-ring color="#FFFFFF" radius-inner="0.93" radius-outer="0.95" rotation="-90 0 0" opacity="0.3"></a-ring>
        <a-ring color="#FFFFFF" radius-inner="1.23" radius-outer="1.25" rotation="-90 0 0" opacity="0.25"></a-ring>

        <!-- PLANETA 1 (azul) — pivote que gira rápido -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
          <a-sphere position="0.64 0 0" radius="0.12" color="#4CC3D9"></a-sphere>
        </a-entity>

        <!-- PLANETA 2 (rojo) — velocidad media, con una LUNA propia -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 7000; easing: linear">
          <a-entity position="0.94 0 0">
            <a-sphere radius="0.16" color="#EF2D5E"></a-sphere>
            <!-- luna orbitando al planeta 2 -->
            <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 2500; easing: linear">
              <a-sphere position="0.28 0 0" radius="0.05" color="#EDEDED"></a-sphere>
            </a-entity>
          </a-entity>
        </a-entity>

        <!-- PLANETA 3 (verde) — el más lento y externo -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 11000; easing: linear">
          <a-sphere position="1.24 0 0" radius="0.14" color="#7BC8A4"></a-sphere>
        </a-entity>

      </a-entity>

      <!-- Título flotante sobre el marcador -->
      <a-text value="Sistema Solar RA" align="center" position="0 1.7 0"
              rotation="-15 0 0" color="#111" width="4"></a-text>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
